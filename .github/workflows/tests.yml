name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install requirements
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: >-
          mypy --strict --implicit-reexport --allow-untyped-calls
          --ignore-missing-imports --follow-imports=silent
          custom_components/plex_stream_bridge
      - name: Pytest
        run: pytest -q --cov=custom_components/plex_stream_bridge --cov-report=term-missing --cov-fail-under=95
